  # --- Agents that sign (Web Bot Auth) ----------------------------------------
  - name: chatgpt-agent
    operator: OpenAI
    category: agent
    note: "help.openai.com refuses scripted fetches (403): no description recorded."
    docs: https://help.openai.com/en/articles/11845367-chatgpt-works-cloud-browser-allowlisting
    wba: https://chatgpt.com
  - name: google-agent
    operator: Google
    category: agent
    docs:
      - https://developers.google.com/crawling/docs/crawlers-fetchers/google-user-triggered-fetchers
      - https://developers.google.com/crawling/docs/crawlers-fetchers/web-bot-auth
    description: "Google-Agent is used by agents hosted on Google infrastructure to navigate the web and perform actions upon user request."
    ips: https://developers.google.com/static/crawling/ipranges/user-triggered-agents.json
    user_agent: Google-Agent
    note: "Signs a subset of requests as https://agent.bot.goog (experimental, per Google), but its JWK kids and request keyids are labels, not the thumbprints draft -00 5.5 and 5.2 require (MUST), so key sync keeps none of its keys. Its alg EdDSA is accepted since 2026-10-09."
    # wba: https://agent.bot.goog  (disabled: see note)
  - name: cloudflare-browser-run
    operator: Cloudflare
    category: agent
    docs: https://developers.cloudflare.com/browser-run/reference/automatic-request-headers/
    description: "Cloudflare automatically attaches headers to every request made through Browser Run."
    wba: https://web-bot-auth.cloudflare-browser-rendering-085.workers.dev
  # Hosted agents that sign, whose directories validate but whose Signature-Agent
  # value (the identifier they send) is not yet confirmed from a signed request.
  # List one only once a signed request from it shows that value in its
  # Signature-Agent header; an entry
  # under the wrong identifier never verifies anything. Cloudflare Radar lists
  # the directory each registered.
  # - name: agentcore-browser  # AWS Bedrock AgentCore Browser; one key per Region
  #   wba: https://xhah6q48pbxb4.keydirectory.signer.us-east-1.on.aws
  # - name: browserbase        # apex 301s to www; opt-in signing (beta)
  #   wba: https://www.browserbase.com
  # - name: kernel-agent
  #   wba: https://www.kernel.sh
  # - name: kernel-search
  #   wba: https://search.bot.kernel.sh
  #   user_agent: KernelSearchBot
  # - name: exasearchbot      # Exa's docs page answered 404; directory found through Cloudflare Radar
  #   wba: https://crawler.exa.ai

  # --- Local agents: claim only ------------------------------------------------
  # These run on the user's own machine and send from the user's IP: no list,
  # no signature, so the User-Agent is all there is. Label them; never trust them.
  # Tokens from each tool's own source.
  - name: gemini-cli
    operator: Google
    category: local-agent
    docs:
      - https://github.com/google-gemini/gemini-cli/blob/main/docs/tools/web-fetch.md
      - https://github.com/google-gemini/gemini-cli/blob/main/packages/core/src/tools/web-fetch.ts
    description: "The `web_fetch` tool allows the Gemini agent to retrieve and process content from specific URLs provided in your prompt."
    user_agent: Google-Gemini-CLI/
  - name: aider
    operator: Aider
    category: local-agent
    docs:
      - https://aider.chat/docs/usage/images-urls.html
      - https://github.com/Aider-AI/aider/blob/main/aider/scrape.py
    description: "Aider can scrape the text from URLs and add it to the chat."
    user_agent: Aider/

