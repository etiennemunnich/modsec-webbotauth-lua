    category: training
    docs: https://support.claude.com/en/articles/8896518-does-anthropic-crawl-data-from-the-web-and-how-can-site-owners-block-the-crawler
    description: "ClaudeBot helps enhance the utility and safety of our generative AI models by collecting web content that could potentially contribute to their training."
    ips: https://claude.com/crawling/bots.json
    user_agent: ClaudeBot
  - name: claude-user
    operator: Anthropic
    category: user-fetch
    docs: https://support.claude.com/en/articles/8896518-does-anthropic-crawl-data-from-the-web-and-how-can-site-owners-block-the-crawler
    description: "Claude-User supports Claude AI users."
