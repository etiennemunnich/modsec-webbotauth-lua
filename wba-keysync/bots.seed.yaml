# bots.seed.yaml: the project's hand-made seed list of bots, every source
# first-party (published by the bot's own operator). Copy it as the start of
# your own bots.yaml, keep what you recognise, add your own, and check it:
#
#   bun wba-keysync/validate.ts bots.yaml
#
# then write agents.txt, the list key sync reads, from it:
#
#   bun wba-keysync/agents.ts bots.yaml --out agents.txt
#
# The catalogue, BOTS.md, is generated from this file and records what every
# source answered:
#
#   bun wba-keysync/report.ts wba-keysync/bots.seed.yaml --catalogue --out wba-keysync/BOTS.md
#
# Fields:
#   name         lower-case, unique
#   operator     who runs the bot
#   category     one of validate.ts CATEGORIES; each is defined by a trigger
#                (crawler or fetcher, draft-meunier-webbotauth-registry-03
#                3.2.4) and an AIPREF purpose (draft-ietf-aipref-vocab-08)
#   purpose      AIPREF labels, only where the operator documents a use other
#                than its category's
#   docs         the operator's own pages about this bot: where the category,
#                tokens and lists come from
#   description  what the operator says the bot does, quoted verbatim from docs
#   wba          where its signing keys live: an https origin, or a JWK Set URL
#                with wba_type: jwks_uri
#   ips          the operator's published IP list URLs
#   rdns         reverse-DNS suffixes the operator documents, for
#                forward-confirmed lookups
#   user_agent   tokens; on their own they are only a claim
#   user_agent_example  checked against the tokens
#   cidrs        a hand-kept copy of the ranges: validate.ts reports how far it
#                has drifted from the live list
#   policy       your choice for this bot, read by lists.ts: allow (refuse whoever
#                claims it from outside its list), deny, or log; none here, since
#                the choice is yours
#   claim_only   true when others send the same User-Agent token, so a claim
#                from outside the list is never refused as an impostor
#   robots       robots.txt product tokens, when they differ from the
#                User-Agent tokens (robots.ts)
# At the top, beside bots: policy_mode: log (the default: policies only log)
# or enforce (policies refuse).
#
# Sources first verified (2026-09-29/30); docs and quotes
# checked 2026-10-09. Re-verify with validate.ts, regenerate BOTS.md.

bots:
  # --- Search ---------------------------------------------------------------
  - name: googlebot
    operator: Google
    category: search
    docs: https://developers.google.com/crawling/docs/crawlers-fetchers/google-common-crawlers
    description: "Crawling preferences addressed to the Googlebot user agent affect Google Search (including Discover and all Google Search features)"
    ips: https://developers.google.com/static/crawling/ipranges/common-crawlers.json
    rdns: [googlebot.com, google.com]
    user_agent: [Googlebot, Googlebot-Image, Googlebot-Video, Storebot-Google, Google-InspectionTool]
  - name: bingbot
    operator: Microsoft
    category: search
    note: "Bing's help page is rendered by script; its text is served at https://www.bing.com/webmasters/api/help/htmlcontent?ArticleId=8c184ec0. The 2012 post documents the reverse-DNS check."
    docs:
      - https://www.bing.com/webmasters/help/which-crawlers-does-bing-use-8c184ec0
      - https://blogs.bing.com/webmaster/2012/8/How-to-Verify-that-Bingbot-is-Bingbot/
    description: "Bingbot is our standard crawler and handles most of our crawling needs each day."
    ips: https://www.bing.com/toolbox/bingbot.json
    rdns: [search.msn.com]
    user_agent: bingbot
  - name: applebot
    operator: Apple
    category: search
    docs: https://support.apple.com/en-us/119829
    description: "The data crawled by Applebot is used to power various features, such as the search technology integrated into many..."
    ips: https://search.developer.apple.com/applebot.json
    rdns: [applebot.apple.com]
    user_agent: Applebot
  - name: duckduckbot
    operator: DuckDuckGo
    category: search
    docs: https://duckduckgo.com/duckduckgo-help-pages/results/duckduckbot
    description: "DuckDuckBot’s job is to constantly improve our search results and offer users the best and most secure search experience possible."
    ips: https://duckduckgo.com/duckduckbot.json
    user_agent: DuckDuckBot
  - name: youbot
    operator: You.com
    category: search
    docs: https://you.com/docs/youbot
    description: "YouBot is the web crawler that powers the You.com search engine."
    wba: https://you.com
    user_agent: YouBot

