  - name: mistralai-user
    operator: Mistral
    category: user-fetch
    docs: https://docs.mistral.ai/robots
    description: "MistralAI-User is for user actions in Vibe."
    ips: https://mistral.ai/mistralai-user-ips.json
    user_agent: MistralAI-User
  # Amazon publishes its lists inside HTML pages (the standard JSON document, embedded).
  - name: amazonbot
    operator: Amazon
