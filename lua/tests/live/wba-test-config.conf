# TEST ONLY (lua/tests/live/run.sh): operator settings for the second
# container, mounted over the shipped web-bot-auth-config.conf. Never deploy.
SecAction "id:9534910,phase:1,pass,nolog,t:none,setvar:'tx.wba_grant_agents=https://other.example https://agent.example'"
SecRule REQUEST_HEADERS:X-WBA-Test "@beginsWith needs-path" \
    "id:9534911,phase:1,pass,nolog,t:none,setvar:'tx.wba_require_components=@method @path'"
SecRule REQUEST_HEADERS:X-WBA-Test "@streq short-window" "id:9534912,phase:1,pass,nolog,t:none,setvar:tx.wba_max_window=60"
SecRule REQUEST_HEADERS:X-WBA-Test "@streq bad-config" "id:9534913,phase:1,pass,nolog,t:none,setvar:tx.wba_max_window=soon"
SecRule REQUEST_HEADERS:X-WBA-Test "@beginsWith needs-nonce" "id:9534916,phase:1,pass,nolog,t:none,setvar:tx.wba_require_nonce=1"
# Recipe C sets tx.bot_management_exempt=1 and logs nothing (nolog): this rule
# logs it in phase 5, after every phase-2 rule, so run.sh finds it in the audit log.
SecRule TX:bot_management_exempt "@eq 1" "id:9534917,phase:5,pass,log,t:none,msg:'WBA-TEST tx.bot_management_exempt=1'"
