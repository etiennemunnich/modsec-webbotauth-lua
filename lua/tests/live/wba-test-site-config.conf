# TEST ONLY (lua/tests/live/run.sh): mounted in every test container as one
# more *-config.conf beside the shipped web-bot-auth-config.conf, the way an
# operator adds their own settings. Never deploy.
#
# The site's own names: the Host the test requests send. Without this, no
# signed request verifies (unverified/no-site-names).
SecAction "id:9534914,phase:1,pass,nolog,t:none,setvar:tx.wba_site_names=example.com"
# RFC 9651 4.2's other branch, for one case: an unparsable field makes the
# message malformed, and wba.conf answers 400.
SecRule REQUEST_HEADERS:X-WBA-Test "@streq malformed-reject" \
    "id:9534915,phase:1,pass,nolog,t:none,setvar:tx.wba_malformed=reject"
# Switching the plugin off, one way per case (run.sh): the switch, the tag
# form, and the CRS id form, which in ModSecurity v3 removes SecRule rules
# only, so the plugin's SecAction and SecRuleScript rules still run.
SecRule REQUEST_HEADERS:X-WBA-Test "@streq recipe-switch-off" \
    "id:9534918,phase:1,pass,nolog,t:none,setvar:tx.web-bot-auth-plugin_enabled=0"
SecRule REQUEST_HEADERS:X-WBA-Test "@streq recipe-tag-off" \
    "id:9534919,phase:1,pass,nolog,t:none,ctl:ruleRemoveByTag=web-bot-auth"
SecRule REQUEST_HEADERS:X-WBA-Test "@beginsWith recipe-ids-off" \
    "id:9534922,phase:1,pass,nolog,t:none,ctl:ruleRemoveById=9534100-9534199"
