# TEST ONLY (lua/tests/live/ftw.sh): writes every request's Web Bot Auth
# outcome to the error log, where go-ftw's log.match_regex can read it. The
# plugin's own rules are nolog, so without this a test could only see the
# rules that refuse. Never deploy this.
SecAction "id:9534930,phase:5,pass,log,t:none,\
    msg:'WBA-RESULT status=%{tx.wba_status} reason=%{tx.wba_reason} agent=%{tx.wba_agent}'"
