# TEST ONLY (lua/tests/live/run.sh): replay accounting on, for the replay
# container, mounted beside the shipped web-bot-auth-config.conf. Never deploy.
SecAction "id:9534920,phase:1,pass,nolog,t:none,setvar:tx.wba_replay_dir=/var/lib/wba/replay"
# A directory the workers cannot write (the key store, mounted read-only).
SecRule REQUEST_HEADERS:X-WBA-Test "@streq replay-unavailable" \
    "id:9534921,phase:1,pass,nolog,t:none,setvar:tx.wba_replay_dir=/etc/modsecurity.d/wba/keys"
