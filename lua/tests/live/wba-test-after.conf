# TEST ONLY (lua/tests/live/run.sh): exposes the outcome of every request that
# carries X-WBA-Test by denying it and logging tx.wba_*. Never deploy this.
SecDebugLog /tmp/modsec-debug.log
SecDebugLogLevel 9
# Requests without a body stop in phase 1 (the backend is a dead port anyway),
# except recipe- cases, which must reach the phase-2 rules of recipes.conf.
SecRule REQUEST_HEADERS:X-WBA-Test "@rx ^(?!body-|recipe-)(.*)$" "id:9534900,phase:1,deny,status:403,nolog,t:none"
# Body cases also log their phase-1 outcome. Every case logs its final
# outcome in phase 5, which runs however the request ended (a 400 from the
# WBA rules included) and whether or not phase 2 ran.
SecRule REQUEST_HEADERS:X-WBA-Test "@rx ^(body-.*)$" "id:9534901,phase:1,pass,log,t:none,capture,\
    msg:'WBA-PHASE1 case=%{TX.1} status=%{tx.wba_status} reason=%{tx.wba_reason}'"
SecRule REQUEST_HEADERS:X-WBA-Test "@streq body-nobody-access" \
    "id:9534902,phase:1,pass,nolog,t:none,ctl:requestBodyAccess=Off"
SecRule REQUEST_HEADERS:X-WBA-Test "@rx ^(.*)$" "id:9534903,phase:5,pass,log,t:none,capture,\
    msg:'WBA-RESULT case=%{TX.1} status=%{tx.wba_status} reason=%{tx.wba_reason} agent=%{tx.wba_agent} keyid=%{tx.wba_keyid}'"
