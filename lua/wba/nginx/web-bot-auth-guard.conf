# Web Bot Auth: nginx half of the request-target guard (http context).
#
# For an absolute-form request line ("GET http://other.example/ HTTP/1.1")
# nginx routes by the request-line host, but hands ModSecurity only the path;
# libmodsecurity rebuilds REQUEST_LINE from that path and reads the Host
# header, which the client chose separately. A signature bound to
# @authority=example.com could then verify a request nginx serves as
# other.example. ModSecurity cannot see the difference, so nginx refuses
# signed requests before ModSecurity runs. Unsigned requests are untouched
# (RFC 9112 3.2.2: servers MUST accept absolute-form).
#
# Only origin-form ("/...") is safe, so the rule refuses every other target
# rather than matching absolute-form. nginx's parser (ngx_http_parse.c,
# sw_method / sw_spaces_before_uri) accepts methods of [A-Z_-], then any
# number of SP, then "/" or a scheme; "^[^ ]+ +[^/ ]" covers all of that,
# and anything a future nginx accepts that is not origin-form.
#
# Forensics: rules see the Host header (SERVER_NAME comes from it too), but
# the connector passes nginx's r->headers_in.server, the request-line host
# for absolute-form, to msc_set_request_hostname. The audit log's "hostname"
# is the host nginx actually served.
#
# Pair with web-bot-auth-guard-server.conf in every server block.
map $request $wba_not_origin_form {
    default 0;
    "~^[^ ]+ +[^/ ]" 1;
}
map "$wba_not_origin_form:$http_signature_input$http_signature" $wba_refuse_signed_non_origin {
    default 0;
    "~^1:." 1;
}

# Web Bot Auth draft 6.1: "An origin SHOULD refuse Signature headers when
# communicated over an unsecured channel." Over cleartext anyone on the path
# can change what a signature does not cover and the request still verifies.
# $wba_tls is 1 when the client's connection to this nginx is TLS. Behind a
# TLS-terminating proxy, replace this map with one built from a header that
# proxy always sets and clients cannot pass through, for example
#   map $http_x_forwarded_proto $wba_tls { default 0; https 1; }
# and only then: a header a client can set itself would undo the check.
map $https $wba_tls {
    default 0;
    on 1;
}
map "$wba_tls:$http_signature_input$http_signature" $wba_refuse_signed_cleartext {
    default 0;
    "~^0:." 1;
}
