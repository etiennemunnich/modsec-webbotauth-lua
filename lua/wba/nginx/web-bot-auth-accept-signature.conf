# Web Bot Auth: asking an agent to sign (server context, in every server
# block that runs the plugin). Draft 5.3: an origin MAY request a signature
# with Accept-Signature (RFC 9421 5.1), and the status SHOULD be 403; after a
# signature or nonce is used more often than policy permits it MAY ask for a
# new one and answer 429 (RFC 6585 4).
#
# ModSecurity v3 cannot add a response header, and ModSecurity-nginx exposes
# no variable, so recipes.conf signals through the status of its deny, and
# this file turns it into the answer. 460 and 461 are unassigned and never
# leave nginx:
#   460 -> 403 with Accept-Signature   (recipes.conf A: sign this request)
#   461 -> 429 with Accept-Signature   (recipes.conf D, E: sign it again)
# Without this file those recipes answer 460 or 461 as they are. The client
# sees 403 or 429; nginx's error log records the 460 or 461 the rule returned,
# and ModSecurity's audit log records the 403 or 429 that was sent.
#
# Two things to keep true where you include this:
# - proxy_intercept_errors off (nginx's default, and the image's): with it on,
#   a backend's own 460 or 461 would come out as 403 or 429 asking for a
#   signature.
# - These locations set add_header, so they inherit none from the server
#   block: repeat any header (HSTS, for one) that must be on every response.
#
# The request is a signature labelled sig1 over @authority, @method, @path
# and the agent's Signature-Agent member keyed sig1 (the draft's own
# convention, 5.2.1); created and expires; nonce, nginx's $request_id (128
# random bits per request); and tag="web-bot-auth". @method and @path tie
# the signature to one request line, and a grant needs them by default
# (tx.wba_grant_require_components). A signer must cover exactly this set
# (RFC 9421 5.2), so if you set tx.wba_require_components, ask for those
# components here too. Cache-Control: no-store keeps a shared cache from
# handing one client's nonce to another (RFC 9421 5 asks the same of
# negotiated responses).
error_page 460 = @wba_sign;
error_page 461 = @wba_sign_again;

location @wba_sign {
    default_type text/plain;
    add_header Accept-Signature 'sig1=("@authority" "@method" "@path" "signature-agent";key="sig1");created;expires;nonce="$request_id";tag="web-bot-auth"' always;
    add_header Cache-Control "no-store" always;
    return 403 "A Web Bot Auth signature is required (Accept-Signature).\n";
}

location @wba_sign_again {
    default_type text/plain;
    add_header Accept-Signature 'sig1=("@authority" "@method" "@path" "signature-agent";key="sig1");created;expires;nonce="$request_id";tag="web-bot-auth"' always;
    add_header Cache-Control "no-store" always;
    return 429 "This signature or nonce was used more often than allowed; sign again (Accept-Signature).\n";
}
