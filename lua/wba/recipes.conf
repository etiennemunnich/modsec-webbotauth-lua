# Example policy built on the Web Bot Auth plugin's variables. Not installed
# by default: copy the rules you need into your own rule file loaded after the
# plugin, and change the paths, user agent and origin. lua/tests/live/run.sh
# runs this exact file.
#
# Every rule decides in phase 2: a body-bound signature is settled there.
# Phase 2 needs request body access on, the CRS default: an exclusion that
# turns it off for a path also stops these rules deciding there.
# Only tx.wba_status "verified" may grant or exempt anything; invalid,
# unverified and not-signed are all "not verified". Most failed signatures
# earn no penalty of their own: stripping the header would get the unsigned
# treatment anyway, so punishing them mostly hurts honest bots mid-rotation.
# Recipe F refuses only the few failures that say a signature is forged.
#
# Rule ids 9534130-9534138 are reserved for these examples (9534139 is the
# README's audit rule for unknown agents).

# A. Require a verified signature on paths reserved for bots, and ask for one
#    (draft 5.3): status 460 becomes 403 with Accept-Signature in
#    nginx/web-bot-auth-accept-signature.conf. Without that file, use
#    status:403. The path is decoded, normalized and lowercased before
#    matching, and /agents counts with or without a slash or a ;parameter, so
#    /./agents/, //agents/, /%61gents/, /AGENTS/, /agents and
#    /agents;jsessionid=x/ (which Java servers route to /agents/) cannot slip
#    past. Over-matching only refuses more, which is the safe direction for a
#    rule that refuses.
SecRule REQUEST_FILENAME "@rx ^/agents(?:[;/]|$)" \
    "id:9534130,phase:2,deny,status:460,log,t:none,t:urlDecodeUni,t:normalizePath,t:lowercase,\
    msg:'Web Bot Auth: a verified signature is required here',\
    tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',severity:'NOTICE',chain"
    SecRule TX:wba_status "!@streq verified" "t:none"

# B. A request whose User-Agent claims to be a bot must be verified for that
#    bot's key directory. The User-Agent proves nothing; this stops anything
#    downstream that trusts it from being fooled. Only for a bot that signs
#    every request: some do not, yet.
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)\bExampleBot/" \
    "id:9534131,phase:2,deny,status:403,log,t:none,\
    msg:'Web Bot Auth: User-Agent claims ExampleBot without its signature',\
    tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',severity:'NOTICE',chain"
    SecRule TX:wba_agent "!@streq https://agent.example/.well-known/http-message-signatures-directory" "t:none"

# C. Exempt granted bots from one of your own bot-management rules, by
#    marking the request for that rule to test. Never use a grant to skip
#    CRS attack detection.
SecRule TX:wba_granted "@streq 1" \
    "id:9534132,phase:2,pass,nolog,t:none,\
    tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',\
    setvar:tx.bot_management_exempt=1"

# D. A signed statement may be used once on the bot paths of recipe A (needs
#    replay accounting: web-bot-auth-config.conf). The count is of what was
#    signed (the signature base), so a copy with other signature bytes, such
#    as ECDSA's (r, n - s), is the same statement, and every verified
#    signature in a request is counted. A second use is refused with 461,
#    which nginx turns into 429 with a fresh Accept-Signature (draft 5.3).
#    Counts are per host. Signing @method and @path as well stops a captured
#    signature being used for another request even once.
SecRule REQUEST_FILENAME "@rx ^/agents(?:[;/]|$)" \
    "id:9534133,phase:2,deny,status:461,log,t:none,t:urlDecodeUni,t:normalizePath,t:lowercase,\
    msg:'Web Bot Auth: signature used %{tx.wba_uses} times',\
    tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',severity:'NOTICE',chain"
    SecRule TX:wba_uses "@gt 1" "t:none"

# E. A nonce is "a random unique value generated for this signature" (RFC
#    9421 2.3): seen twice, under any signature, anywhere on the site, the
#    second request is refused with 461 (429 with Accept-Signature).
SecRule TX:wba_nonce_uses "@gt 1" \
    "id:9534134,phase:2,deny,status:461,log,t:none,\
    msg:'Web Bot Auth: nonce used %{tx.wba_nonce_uses} times',\
    tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',severity:'NOTICE'"

# F. Refuse a signature that cannot be genuine (opt in; run it as pass,log
#    first and read the log's reason). Most failures earn nothing (top of this
#    file). These four say the signature is wrong for this request, not that a
#    clock or a key moved: foreign-authority (a signature made for another
#    site, replayed here: the Host is not one of tx.wba_site_names),
#    bad-signature (not a valid signature for the key it
#    names: bytes no allowed key could accept, or the check failed for a key
#    you hold, which a forger causes, and so does a proxy that rewrites a
#    covered header), digest-mismatch (the body is not the one signed) and
#    test-key (a published key, which anyone can sign with). Stripping the
#    headers still gets the unsigned treatment: this refuses forged and
#    broken signatures; recipe A is the gate. With several signatures the
#    request takes the best outcome, and invalid ranks above unverified: one
#    broken signature beside one from a key you do not hold is refused.
SecRule TX:wba_reason "@rx ^(?:foreign-authority|bad-signature|digest-mismatch|test-key)$" \
    "id:9534135,phase:2,deny,status:403,log,t:none,\
    msg:'Web Bot Auth: a signature that cannot be genuine (%{tx.wba_reason})',\
    tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',severity:'WARNING',chain"
    SecRule TX:wba_status "@streq invalid" "t:none"
