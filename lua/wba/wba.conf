# Web Bot Auth: the plugin's own rules. Do not edit; your settings go in
# web-bot-auth-config.conf, and your decisions in your own *-after.conf.
#
# What it does, per request:
#   - no signature headers: sets tx.wba_status=not-signed and stops (rule 2);
#   - signed: the Lua verifier checks the signature against the key store
#     (rule 4), and again in phase 2 if it covers the body (rule 6);
#   - writes one JSON log line per signed request (rule 7).
# It refuses nothing itself, except 400 for a header it cannot read (rule 5).
#
# What it sets, for your rules:
#   tx.wba_status   verified | invalid | unverified | not-signed
#   tx.wba_reason   why (README, Outcomes and reasons)
#   tx.wba_agent    which bot it verified for (its key directory or key URL)
#   tx.wba_granted  1 when that bot is in your grants and the signature covers
#                   what a grant needs (web-bot-auth-config.conf)
# and, only when verified: tx.wba_keyid, tx.wba_label, tx.wba_created,
# tx.wba_expires, tx.wba_covered, tx.wba_sighash, tx.wba_agents,
# tx.wba_agent_proof, and with replay counting tx.wba_uses and
# tx.wba_nonce_uses. Anything not set reads "n/a" (rule 1).
#
# Install: /etc/modsecurity.d/owasp-crs/plugins/web-bot-auth-before.conf (a
# "before" file, so the variables exist before any CRS rule runs). If you
# install elsewhere, change the SecRuleScript paths here and CONFIG in
# modsecurity_entry.lua. Rule ids 9534100-9534129 (web-bot-auth-config.conf
# uses 9534112 for the on/off switch; recipes.conf has 9534130-9534138; 9534139 is the README's audit rule).
#
# Every rule carries tag:'web-bot-auth', so ctl:ruleRemoveByTag=web-bot-auth
# removes them all for a request (README, Turning the plugin off). In
# ModSecurity v3, ctl:ruleRemoveById does not: it skips SecRule rules only,
# never SecAction or SecRuleScript.
#
# The Lua is loaded with SecRuleScript, which compiles the file it names when
# the configuration loads: if modsecurity_entry.lua or wba_log.lua does not
# compile, nginx does not start (@inspectFile would quietly run it as a
# program). The modules they load (verify.lua and the rest) are compiled on
# every request instead, so a syntax error in one stops nothing at start: each
# signed request reads unverified/engine-error (rule 3), and the debug log at
# level 2 says "Failed to execute lua script: ..." with the Lua error.

# 1. Start every request as unsigned, and every other variable as "n/a".
#    A rule never matches a variable that does not exist, even a negated one
#    ("!@streq"), so each variable must exist. ("n/a" because ModSecurity v3
#    cannot set an empty value.)
SecAction "id:9534100,phase:1,pass,nolog,t:none,\
    tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',\
    setvar:tx.wba_status=not-signed,\
    setvar:tx.wba_reason=no-signature,\
    setvar:tx.wba_agent=n/a,\
    setvar:tx.wba_agents=n/a,\
    setvar:tx.wba_agent_proof=n/a,\
    setvar:tx.wba_keyid=n/a,\
    setvar:tx.wba_label=n/a,\
    setvar:tx.wba_created=n/a,\
    setvar:tx.wba_expires=n/a,\
    setvar:tx.wba_covered=n/a,\
    setvar:tx.wba_sighash=n/a,\
    setvar:tx.wba_uses=n/a,\
    setvar:tx.wba_nonce_uses=n/a,\
    setvar:tx.wba_granted=0"

# On/off switch (tx.web-bot-auth-plugin_enabled=0, web-bot-auth-config.conf):
# the plugin then does nothing in phases 1, 2 and 5. It sits after rule 1, so
# every variable still exists and reads not-signed/n/a: your rules see "not
# verified", never a missing variable. One rule per phase, because skipAfter
# skips only within its own phase; SecAction and SecRuleScript rules are
# skipped too, which ctl:ruleRemoveById would not do.
SecRule TX:web-bot-auth-plugin_enabled "@eq 0" \
    "id:9534109,phase:1,pass,nolog,t:none,\
    tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',\
    skipAfter:END-WBA-VERIFY"

# 1b. At paranoia level 4, CRS rule 920274 allows only a very strict set of
#     characters in request headers. Signature-Input always needs "(", ")" and
#     "@" (RFC 9651 inner lists, RFC 9421 derived names); a Signature-Agent URL
#     may need others; and an ActivityPub draft-cavage Signature header carries
#     "(request-target)". Those three headers skip that one rule; every other
#     CRS check on them still runs. The names are regular expressions because
#     ModSecurity compares those case-insensitively, and HTTP/2 sends every
#     header name in lower case: a ctl:ruleRemoveTargetById name is compared
#     exactly as written, so "Signature-Input" missed every HTTP/2 request.
SecRuleUpdateTargetById 920274 "!REQUEST_HEADERS:/^signature-input$/|!REQUEST_HEADERS:/^signature$/|!REQUEST_HEADERS:/^signature-agent$/"

# 2. No signature headers: stop here, no Lua runs.
SecRule &REQUEST_HEADERS:Signature-Input "@eq 0" \
    "id:9534101,phase:1,pass,nolog,t:none,\
    tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',\
    chain,skipAfter:END-WBA-VERIFY"
    SecRule &REQUEST_HEADERS:Signature "@eq 0" "t:none"

# 3. Signed. Assume it failed until the verifier says otherwise: if the Lua
#    cannot load (lua-openssl missing, say), this result stands.
SecAction "id:9534102,phase:1,pass,nolog,t:none,\
    tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',\
    setvar:tx.wba_status=unverified,\
    setvar:tx.wba_reason=engine-error"

# 4. Verify (once per request, however many signatures it carries).
SecRuleScript /etc/modsecurity.d/wba/lua/modsecurity_entry.lua "id:9534103,phase:1,pass,nolog,\
    tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0'"

SecMarker END-WBA-VERIFY

# 5. 400 for a header the verifier cannot read, when that means the request
#    is broken (reasons starting "malformed-"):
#    - a body digest the signature covers (Content-Digest and the like):
#      always, since ignoring it would leave the body unchecked;
#    - a signature header: only with tx.wba_malformed=reject. By default an
#      unreadable Signature-Input or Signature counts as unsigned.
SecRule TX:wba_reason "@rx ^malformed-" \
    "id:9534107,phase:1,deny,status:400,log,t:none,\
    msg:'Web Bot Auth: unparsable field (%{tx.wba_reason})',\
    tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',severity:'WARNING'"

# 6. A signature that covers the body is finished here, once the body has
#    arrived. Until then it reads unverified/digest-pending, and it stays so
#    if phase 2 never runs: never verified without its body.
SecRule TX:web-bot-auth-plugin_enabled "@eq 0" \
    "id:9534110,phase:2,pass,nolog,t:none,\
    tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',\
    skipAfter:END-WBA-BODY"
SecRule TX:wba_reason "!@streq digest-pending" \
    "id:9534104,phase:2,pass,nolog,t:none,\
    tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',\
    skipAfter:END-WBA-BODY"
SecAction "id:9534105,phase:2,pass,nolog,t:none,\
    tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',\
    setvar:tx.wba_stage=body"
SecRuleScript /etc/modsecurity.d/wba/lua/modsecurity_entry.lua "id:9534106,phase:2,pass,nolog,\
    tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0'"

SecMarker END-WBA-BODY

# 7. Log one JSON line per signed request, at the very end (phase 5), so it
#    records the final outcome. None for unsigned requests, but one for an
#    unreadable signature header, so you can see broken clients. The line
#    never holds the signature itself (wba_log.lua says what it holds and
#    where it goes). To turn it off: SecRuleRemoveById 9534121.
SecRule TX:web-bot-auth-plugin_enabled "@eq 0" \
    "id:9534111,phase:5,pass,nolog,t:none,\
    tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',\
    skipAfter:END-WBA-LOG"
SecRule TX:wba_status "@streq not-signed" \
    "id:9534120,phase:5,pass,nolog,t:none,\
    tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',\
    chain,skipAfter:END-WBA-LOG"
    SecRule TX:wba_reason "!@streq unparsable-field" "t:none"
SecRuleScript /etc/modsecurity.d/wba/lua/wba_log.lua "id:9534121,phase:5,pass,nolog,\
    tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0'"

SecMarker END-WBA-LOG

# Writing your own rules on these variables: compare with @streq (@eq compares
# numbers, so "@eq verified" matches everything), and decide in phase 2, when
# body-covering signatures are finished. Examples: recipes.conf.
