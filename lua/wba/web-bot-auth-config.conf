# Web Bot Auth: your settings.
#
# Every setting below is commented out and has a default. Uncomment one to
# change it. You must set one: your site names. Until you do, no signature is
# accepted (unverified/no-site-names).
#
# A setting with a bad value makes every signed request unverified/bad-config,
# and the log says why, so a typo never goes unnoticed.
#
# Install: /etc/modsecurity.d/owasp-crs/plugins/web-bot-auth-config.conf
# (CRS loads it before the plugin's rules). Rule ids 9534010-9534019, and
# 9534112 for the on/off switch.

# On or off. Unset or 1 (the default): the plugin runs. 0: no Lua runs, no
# log line is written, and every request reads
# tx.wba_status=not-signed, so your own rules treat it as unsigned (recipe A
# still refuses it on /agents). The rule only sets 0 when nothing earlier set
# the variable, so a rule of yours placed before it can choose per site, for
# example from the Host header. To skip the plugin for some paths only, see
# the README (Turning the plugin off). One thing the switch does not undo:
# at paranoia level 4, CRS rule 920274 keeps skipping the three signature
# headers (that exclusion is applied when the rules load, not per request).
#
# SecRule &TX:web-bot-auth-plugin_enabled "@eq 0" \
#     "id:9534112,phase:1,pass,nolog,t:none,tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',setvar:tx.web-bot-auth-plugin_enabled=0"

# REQUIRED. Your site names, as sent in the Host header, separated by spaces.
# A signature names the site it was made for, so one made for someone else's
# site and replayed here is refused (invalid/foreign-authority).
#
# SecAction "id:9534017,phase:1,pass,nolog,t:none,tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',\
#     setvar:'tx.wba_site_names=example.com www.example.com'"

# Grants: bots you trust. A verified request from one of them gets
# tx.wba_granted=1, which your own rules can use, for example to skip a rate
# limit (recipes.conf). Write each bot as in agents.txt; matching is exact.
# Relax bot controls with it, never attack detection: a signature proves who
# sent a request, not that it is safe. Default: none.
#
# SecAction "id:9534010,phase:1,pass,nolog,t:none,tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',\
#     setvar:'tx.wba_grant_agents=https://bot.example https://crawler.example'"

# Parts every signature must cover. A signature over the site name alone
# could be replayed to any page until it expires; requiring @method and
# @path ties it to one request. Default: none. Set it for the whole site, or
# for some paths, as in the second example. If you ask bots for a signature
# (nginx/web-bot-auth-accept-signature.conf), ask for the same parts there.
#
# SecAction "id:9534011,phase:1,pass,nolog,t:none,tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',\
#     setvar:'tx.wba_require_components=@method @path'"
#
# SecRule REQUEST_FILENAME "@beginsWith /api/" \
#     "id:9534012,phase:1,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,t:lowercase,tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',\
#     setvar:'tx.wba_require_components=@method @path @query'"

# Longest signature a bot may declare, in seconds (from created to expires).
# Default: no limit, because the one-hour maximum age below already limits
# how long any signature counts; a day (86400) if you turn that off.
#
# SecAction "id:9534013,phase:1,pass,nolog,t:none,tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',setvar:tx.wba_max_window=3600"

# Three settings in one rule:
#   tx.wba_max_age        a signature counts for this many seconds after the
#                         bot made it, never past its own expiry. Default
#                         3600 (one hour); 0 turns it off.
#   tx.wba_expiry_grace   seconds past expiry still accepted, 0 to 60, for
#                         clocks a little behind the bot's. Default 0.
#   tx.wba_malformed      what a signature header that cannot be read does.
#                         ignore (default): an unreadable Signature-Input or
#                         Signature counts as unsigned, so Mastodon's own
#                         "Signature" header passes; reject: 400 for either.
#                         An unreadable Signature-Agent is invalid both ways:
#                         invalid/missing-component in the usual ;key= form.
#                         A body digest the signature covers that cannot be
#                         read always gets 400, whatever this says.
#
# SecAction "id:9534018,phase:1,pass,nolog,t:none,tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',\
#     setvar:tx.wba_max_age=3600,setvar:tx.wba_expiry_grace=0,setvar:tx.wba_malformed=ignore"

# What a grant needs the signature to cover. Default "@method @path"; "none"
# for nothing. A signature over the site name alone works for any page, so
# granting on it would let it be reused anywhere. Such a request is still
# verified, just not granted.
#
# SecAction "id:9534019,phase:1,pass,nolog,t:none,tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',\
#     setvar:'tx.wba_grant_require_components=@method @path'"

# Replay counting: a directory where this host counts how often each
# signature, and each nonce, is used. Verified requests then carry
# tx.wba_uses and tx.wba_nonce_uses for your rules (recipes D and E answer
# 429). Default: off.
#   - nginx (uid 101 in the image) must be able to write it; if it cannot, or
#     the disk is full, nothing verifies (unverified/replay-unavailable).
#   - Give it its own filesystem, and run wba-keysync/sweep.ts on a timer.
#   - Counts are per host: behind a load balancer, once per host.
#
# SecAction "id:9534014,phase:1,pass,nolog,t:none,tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',setvar:tx.wba_replay_dir=/var/lib/wba/replay"

# Require a nonce: a signature without one is unverified/missing-nonce. With
# replay counting and recipe E, every signature must then be new. Default:
# off. Set it for the whole site, or per path as for the parts above.
#
# SecAction "id:9534015,phase:1,pass,nolog,t:none,tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',setvar:tx.wba_require_nonce=1"

# Strict header lines. A header sent as several lines is normally joined and
# then read (RFC 9651). With this on, each line must also read on its own;
# one that does not is handled as tx.wba_malformed says, or gets 400 for a
# covered body digest. Default: off.
#
# SecAction "id:9534016,phase:1,pass,nolog,t:none,tag:'web-bot-auth',ver:'web-bot-auth-plugin/0.1.0',setvar:tx.wba_strict_field_lines=1"
