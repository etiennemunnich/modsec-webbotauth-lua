# The version matrix: lua/tests/live/run.sh against every image in
# lua/tests/live/crs-images.txt, one job per image. Each job records
# what the image actually contains (lua/tests/live/matrix.sh) and fails unless
# its row reads PASS; the summary job puts every row in one table.
#
# Runs when the image list or the Dockerfile changes on main, on the first of
# each month, and by hand (Actions > crs-matrix > Run workflow). With 24
# images at 2 to 4 minutes each, a run on one CLI costs about 70 to 80
# runner-minutes, eight jobs at a time; too many minutes to spend on every
# push.
#
# Scheduled and push runs use Finch. A run by hand uses Finch and Docker (the
# runner's own), one job per image per CLI, to prove the matrix on both; it
# takes no inputs (Checkov CKV_GHA_7: user input must not shape a run).
#
# On schedule or push failure, the summary job opens or comments on a single
# open issue labeled crs-matrix (deduped). Manual dispatch does not file
# issues. Other workflows keep contents: read only.
name: crs-matrix

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"
  push:
    branches: [main]
    paths:
      - lua/tests/live/crs-images.txt
      - lua/wba/Dockerfile

# Default: read only. The summary job alone raises issues: write when filing
# a failure issue; list/image jobs never get that permission.
permissions:
  contents: read

# A newer run (a later image list, say) cancels an older one still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list:
    name: Image list
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tags
        run: echo "tags=$(grep -v -e '^#' -e '^$' lua/tests/live/crs-images.txt | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  image:
    needs: list
    name: ${{ matrix.tag }} on ${{ matrix.runtime }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        tag: ${{ fromJSON(needs.list.outputs.tags) }}
        runtime: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["finch","docker"]' || '["finch"]') }}
    env:
      # Finch runs as root on Linux; the runner's user can use Docker directly.
      DOCKER: ${{ matrix.runtime == 'finch' && 'sudo finch' || 'docker' }}
      LUA: lua5.4
      TAG: ${{ matrix.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Install Lua and openssl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4 openssl
      - name: Install Finch (removes the runner's Docker)
        if: matrix.runtime == 'finch'
        run: bash .github/scripts/install-finch.sh
      - name: Run the live suite on this image
        run: |
          printf '%s\n' "$TAG" > "$RUNNER_TEMP/image.txt"
          IMAGES="$RUNNER_TEMP/image.txt" LOGS="$RUNNER_TEMP/logs" bash lua/tests/live/matrix.sh "$RUNNER_TEMP/row.tsv"
          cat "$RUNNER_TEMP/row.tsv"
      - name: The row must read PASS
        run: awk -F'\t' 'NR > 1 && $11 != "PASS" { bad = 1 } END { exit bad }' "$RUNNER_TEMP/row.tsv"
      - name: Keep the row and, on failure, the run log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: row-${{ matrix.runtime }}-${{ matrix.tag }}
          path: |
            ${{ runner.temp }}/row.tsv
            ${{ runner.temp }}/logs/
          if-no-files-found: warn
          retention-days: 35

  summary:
    name: Summary table
    needs: [list, image]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Scoped write: only this job may open or comment on crs-matrix issues.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: row-*
          path: rows
      - name: One table
        id: table
        run: |
          {
            echo "| CLI | image | ModSecurity | connector | CRS | Lua | unit | Wycheproof | live pass | live fail | live skip | verdict |"
            echo "|---|---|---|---|---|---|---|---|---|---|---|---|"
            for f in rows/row-*/row.tsv; do
              [ -f "$f" ] || continue
              cli=${f#rows/row-}; cli=${cli%%-*}  # rows/row-<cli>-<tag>/row.tsv
              tail -n +2 "$f" | sed "s/^/$cli\t/"
            done | sort | awk -F'\t' '{ printf "|"; for (i = 1; i <= NF; i++) printf " %s |", $i; print "" }'
          } | tee "$RUNNER_TEMP/matrix-table.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update crs-matrix failure issue
        # Schedule and main-path push only: manual dispatch is for operators
        # who already watch the run. Dedupes to one open issue labeled
        # crs-matrix; comments on a later failure instead of opening another.
        if: >-
          always() &&
          (github.event_name == 'schedule' || github.event_name == 'push') &&
          (needs.list.result == 'failure' || needs.image.result == 'failure')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MATRIX_TABLE_PATH: ${{ runner.temp }}/matrix-table.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LIST_RESULT: ${{ needs.list.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
        with:
          script: |
            const fs = require('fs');
            const title = 'crs-matrix: image suite failure';
            const label = 'crs-matrix';
            const runUrl = process.env.RUN_URL;
            const listResult = process.env.LIST_RESULT;
            const imageResult = process.env.IMAGE_RESULT;
            let table = '';
            try {
              table = fs.readFileSync(process.env.MATRIX_TABLE_PATH, 'utf8').trim();
            } catch (_) {
              table = '_(no matrix table; list or artifact download failed)_';
            }
            const body = [
              'Automated report from the **crs-matrix** workflow.',
              '',
              `- Run: ${runUrl}`,
              `- Event: \`${context.eventName}\``,
              `- Ref: \`${context.ref}\``,
              `- SHA: \`${context.sha}\``,
              `- \`list\` job: \`${listResult}\``,
              `- \`image\` job: \`${imageResult}\``,
              '',
              '## Summary table',
              '',
              table || '_(empty)_',
              '',
              'Artifacts (`row-*`) are kept for 35 days on the run above.',
              'Close this issue when the matrix is green again on the same pins,',
              'or after refreshing `lua/tests/live/crs-images.txt` / the Dockerfile pin.',
            ].join('\n');

            // Ensure the label exists (issues: write can create labels).
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch (err) {
              if (err.status !== 404) throw err;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: 'B60205',
                description: 'CRS version matrix (crs-matrix workflow) failures',
              });
            }

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 20,
            });
            const existing = open.data.find(
              (i) => !i.pull_request && i.title === title
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Commented on existing issue #${existing.number}`);
              return;
            }
            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: [label],
            });
            core.info(`Opened issue #${created.data.number}`);
