# Newer official CRS nginx images than lua/tests/live/crs-images.txt.
#
# The monthly crs-matrix retests the tags already listed. This workflow runs
# the same live suite, on Finch only, when Docker Hub has a newer multi-arch
# Debian build of the newest stable CRS v4, the newest stable CRS v3.3, or
# the newest stable release on an LTS minor the list already tracks. A newer
# build of the current release is how a new libmodsecurity reaches the image
# before the next CRS tag. Alpine images are not tested.
#
# Monday 05:41 UTC, and by hand. A pull request that touches this workflow or
# the selector runs the selector and its fixture only: image builds stay on
# the schedule and on a manual run. A tag is not run again once its
# crs-image issue has a passing result, or three failing results.
#
# A result is filed on one issue per tag, titled "crs-image: <tag>", whether
# the suite passed or failed. Passing does not edit crs-images.txt.
name: crs-new-images

on:
  workflow_dispatch:
  schedule:
    - cron: "41 5 * * 1"
  pull_request:
    paths:
      - .github/workflows/crs-new-images.yml
      - lua/tests/live/new_images.py
      - lua/tests/live/crs-images.txt

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    name: New image tags
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Selector fixture
        run: python3 lua/tests/live/new_images.py --self-test
      - id: tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          raw="$(python3 lua/tests/live/new_images.py --json --settle --repo="${GITHUB_REPOSITORY}")"
          python3 -c 'import json,sys; json.loads(sys.argv[1])' "$raw"
          echo "tags=$raw" >> "$GITHUB_OUTPUT"
          echo "$raw"

  image:
    needs: discover
    if: >-
      needs.discover.outputs.tags != '[]' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    name: ${{ matrix.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        tag: ${{ fromJSON(needs.discover.outputs.tags) }}
    env:
      DOCKER: sudo finch
      LUA: lua5.4
      TAG: ${{ matrix.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Install Lua and openssl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4 openssl
      - name: Install Finch (removes the runner's Docker)
        run: bash .github/scripts/install-finch.sh
      - name: Run the live suite on this image
        run: |
          printf '%s\n' "$TAG" > "$RUNNER_TEMP/image.txt"
          IMAGES="$RUNNER_TEMP/image.txt" LOGS="$RUNNER_TEMP/logs" bash lua/tests/live/matrix.sh "$RUNNER_TEMP/row.tsv"
          cat "$RUNNER_TEMP/row.tsv"
      - name: The row must read PASS
        run: awk -F'\t' 'NR > 1 && $11 != "PASS" { bad = 1 } END { exit bad }' "$RUNNER_TEMP/row.tsv"
      - name: Keep the row and, on failure, the run log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: row-${{ matrix.tag }}
          path: |
            ${{ runner.temp }}/row.tsv
            ${{ runner.temp }}/logs/
          if-no-files-found: warn
          retention-days: 35

  summary:
    name: Record results
    needs: [discover, image]
    if: >-
      always() &&
      needs.discover.result == 'success' &&
      needs.discover.outputs.tags != '[]' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: row-*
          path: rows
      - name: Comment on each crs-image issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAGS_JSON: ${{ needs.discover.outputs.tags }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          IMAGE_RESULT: ${{ needs.image.result }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const tags = JSON.parse(process.env.TAGS_JSON);
            const runUrl = process.env.RUN_URL;
            const rows = new Map();
            function walk(dir) {
              if (!fs.existsSync(dir)) return;
              for (const name of fs.readdirSync(dir)) {
                const full = path.join(dir, name);
                if (fs.statSync(full).isDirectory()) walk(full);
                else if (name === 'row.tsv') {
                  const lines = fs.readFileSync(full, 'utf8').trim().split('\n');
                  if (lines.length < 2) continue;
                  const cols = lines[1].split('\t');
                  rows.set(cols[0], lines[1]);
                }
              }
            }
            walk('rows');
            const label = 'crs-image';
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch (err) {
              if (err.status !== 404) throw err;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: '1D76DB',
                description: 'New official CRS nginx image (crs-new-images)',
              });
            }
            const all = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            let failed = 0;
            for (const tag of tags) {
              const row = rows.get(tag);
              const passed = Boolean(row && row.split('\t')[10] === 'PASS');
              if (!passed) failed += 1;
              const title = `crs-image: ${tag}`;
              const mark = passed ? '## ✅' : '## ❌';
              const body = [
                mark,
                '',
                passed
                  ? `\`${tag}\` passed the live suite on Finch. The image list was not changed.`
                  : `\`${tag}\` did not pass the live suite on Finch.`,
                '',
                `- Run: ${runUrl}`,
                `- \`image\` jobs: \`${process.env.IMAGE_RESULT}\``,
                '',
                row ? ['```', row, '```'].join('\n') : 'No result row was uploaded.',
              ].join('\n');
              const existing = all.find((issue) => !issue.pull_request && issue.title === title);
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: [label],
                });
              }
            }
            if (failed > 0) {
              core.setFailed(`${failed} image(s) did not pass`);
            }
