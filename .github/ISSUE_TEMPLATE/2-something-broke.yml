name: Something broke
description: A step failed, a tool crashed, or nginx would not start.
labels: ["alpha-feedback", "bug"]
body:
  - type: markdown
    attributes:
      value: "For a security problem, do not use this form: see [SECURITY.md](https://github.com/etiennemunnich/modsec-webbotauth-lua/blob/main/SECURITY.md)."
  - type: input
    id: version
    attributes:
      label: Which version?
      description: The release tag, or the commit you built from (git rev-parse --short HEAD).
      placeholder: v0.1.0-alpha.2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where did it break?
      options:
        - Building the image
        - Quick start
        - Installing on Debian 13 (GETTING-STARTED.md)
        - wba-keysync (key sync, validate, agents, lists, robots, report, sign, sweep)
        - nginx or ModSecurity while running
        - Running the tests
        - Other
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: What did you run?
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What did it print?
      description: The error, and a few lines before it.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Your setup
      description: Operating system, Finch or Docker and its version, Bun or Node and its version, CRS image tag (or a Debian 13 install without the image).
    validations:
      required: true
